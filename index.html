<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title></title>

<style>
:root{
  --bg:#0b0d12;
  --card:rgba(18,22,31,.78);
  --line:rgba(255,255,255,.13);
  --txt:#f6f7fb;
  --muted:#aeb5c4;
  --accent:#8b7cff;
  --accent2:#43d9ff;
  --danger:#ff5575;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--txt)
}

body{
  background-image:
    linear-gradient(135deg,rgba(5,7,12,.82),rgba(5,7,12,.48)),
    var(--user-bg);
  background-size:cover;
  background-position:center;
  transition:background-image .35s ease
}

button,input,textarea{
  font:inherit
}

button{
  color:inherit;
  border:0;
  cursor:pointer
}

.app{
  height:100dvh;
  width:100%;
  max-width:720px;
  margin:auto;
  display:flex;
  flex-direction:column;
  position:relative;
  padding:
    calc(12px + var(--safe-top))
    12px
    calc(12px + var(--safe-bottom));
  gap:10px
}

/* =========================
   IMAGE SLOT
   ========================= */

.image-slot{
  position:fixed;
  z-index:8;
  top:calc(12px + var(--safe-top) + 52px);
  left:12px;
  width:72px;
  height:72px;
  border:1px solid rgba(255,255,255,.16);
  border-radius:17px;
  background:rgba(12,15,22,.64);
  backdrop-filter:blur(15px);
  box-shadow:0 10px 35px #0006;
  overflow:visible;
  display:grid;
  place-items:center;
  transition:
    transform .2s ease,
    border-color .2s ease,
    background .2s ease
}

.image-slot:active{
  transform:scale(.94)
}

.image-slot img{
  width:100%;
  height:100%;
  border-radius:16px;
  object-fit:contain;
  display:block;
  cursor:pointer
}

.image-slot.empty{
  cursor:pointer
}

.image-slot.empty::before{
  content:"+";
  color:#9ca5b6;
  font-size:25px;
  font-weight:300;
  line-height:1
}

.image-slot.empty::after{
  content:"PNG";
  position:absolute;
  bottom:7px;
  left:0;
  right:0;
  text-align:center;
  font-size:8px;
  letter-spacing:.13em;
  color:#6f7787;
  pointer-events:none
}

.image-slot.removing{
  border-color:rgba(255,85,117,.8);
  background:rgba(255,85,117,.14);
  box-shadow:
    0 0 0 2px rgba(255,85,117,.16),
    0 10px 35px #0008
}

.image-slot input{
  display:none
}

/* =========================
   TOPBAR
   ========================= */

.topbar{
  height:52px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px
}

.icon{
  width:46px;
  height:46px;
  border:1px solid var(--line);
  background:rgba(12,15,22,.72);
  backdrop-filter:blur(16px);
  border-radius:15px;
  font-size:20px;
  display:grid;
  place-items:center;
  box-shadow:0 8px 30px #0003
}

/* =========================
   PLAYERS
   ========================= */

.players{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:10px
}

.player{
  min-height:0;
  border:1px solid var(--line);
  border-radius:28px;
  background:var(--card);
  backdrop-filter:blur(18px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:16px;
  box-shadow:0 20px 60px #0004;
  position:relative;
  overflow:hidden
}

.player:before{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,124,255,.16),
      transparent 38%
    );
  pointer-events:none
}

.pname{
  font-size:12px;
  color:var(--muted);
  letter-spacing:.12em;
  text-transform:uppercase;
  text-align:center;
  position:relative;
  z-index:1
}

.lp{
  font-size:clamp(48px,13vw,88px);
  font-weight:800;
  letter-spacing:-.05em;
  text-align:center;
  line-height:1;
  margin:7px 0 10px;
  text-shadow:0 5px 30px #0008;
  position:relative;
  z-index:1;
  transition:
    color .25s ease,
    text-shadow .25s ease
}

/* =========================
   LIFE BAR
   ========================= */

.life-bar{
  width:min(440px,92%);
  height:7px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
  position:relative;
  z-index:1;
  margin:0 auto 13px;
  box-shadow:
    inset 0 1px 4px #0008,
    0 2px 12px #0004
}

.life-fill{
  height:100%;
  width:100%;
  min-width:0;
  border-radius:inherit;
  background:#69d98b;
  box-shadow:
    0 0 9px rgba(105,217,139,.22);
  transition:
    width .35s cubic-bezier(.22,.7,.2,1),
    background .45s ease,
    box-shadow .45s ease
}

/* =========================
   LIFE POINT CONTROLS
   ========================= */

.controls{
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 58px;
  gap:7px;
  max-width:440px;
  width:100%;
  margin:0 auto;
  position:relative;
  z-index:1;
  align-self:center
}

.lp-op{
  height:42px;
  border-radius:13px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  font-weight:800;
  font-size:24px;
  line-height:1;
  transition:
    .16s transform,
    .16s background,
    .16s box-shadow
}

.lp-op.minus{
  color:#ff8da4
}

.lp-op.plus{
  color:#8cf3ff
}

.lp-op:active,
.lp-op.selected{
  transform:scale(.94);
  background:rgba(255,255,255,.15);
  box-shadow:0 0 0 1px rgba(255,255,255,.08)
}

.lp-amount{
  height:42px;
  width:100%;
  border-radius:13px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--line);
  color:var(--txt);
  text-align:center;
  outline:none;
  font-weight:750;
  font-size:15px;
  transition:
    .16s border-color,
    .16s box-shadow
}

.lp-amount::placeholder{
  color:var(--muted)
}

.lp-amount:focus{
  border-color:rgba(139,124,255,.55);
  box-shadow:0 0 0 3px rgba(139,124,255,.10)
}

.lp-amount::-webkit-outer-spin-button,
.lp-amount::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0
}

.lp-amount[type=number]{
  -moz-appearance:textfield
}

/* =========================
   BOTTOM TOOLS
   ========================= */

.bottom{
  height:66px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:8px
}

.tool{
  border:1px solid var(--line);
  border-radius:18px;
  background:rgba(12,15,22,.75);
  backdrop-filter:blur(16px);
  font-size:21px;
  box-shadow:0 8px 30px #0004;
  transition:.16s transform,.16s background
}

.tool:active{
  transform:scale(.94);
  background:rgba(255,255,255,.15)
}

/* =========================
   MODAL
   ========================= */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  backdrop-filter:blur(10px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:
    12px
    12px
    calc(12px + var(--safe-bottom));
  z-index:20
}

.modal.open{
  display:flex
}

.sheet{
  width:min(700px,100%);
  max-height:88dvh;
  background:rgba(17,21,30,.96);
  border:1px solid var(--line);
  border-radius:28px;
  padding:16px;
  box-shadow:0 30px 100px #000b;
  animation:up .25s ease
}

@keyframes up{
  from{
    transform:translateY(20px);
    opacity:0
  }
  to{
    transform:none;
    opacity:1
  }
}

.sheethead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.sheethead b{
  font-size:17px
}

.close{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#fff1
}

/* =========================
   HISTORY / NOTES
   ========================= */

.history{
  overflow:auto;
  max-height:55dvh;
  display:flex;
  flex-direction:column;
  gap:7px
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 12px;
  border-radius:13px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08)
}

.row small{
  color:var(--muted)
}

.gain{
  color:#83f0c4
}

.loss{
  color:#ff8ba3
}

textarea{
  width:100%;
  height:55dvh;
  resize:none;
  background:#0b0e14;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  outline:none
}

/* =========================
   DICE
   ========================= */

.dice-wrap,
.coin-wrap{
  height:55dvh;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:
    radial-gradient(circle,#242a3c,#0b0e14 65%)
}

.die{
  width:100px;
  height:100px;
  background:linear-gradient(145deg,#fff,#cdd4df);
  border-radius:20px;
  display:grid;
  place-items:center;
  color:#111;
  font-size:48px;
  font-weight:900;
  box-shadow:
    0 18px 40px #0008,
    inset 0 2px 3px #fff;
  user-select:none;
  transform-style:preserve-3d;
  will-change:transform,filter;
  perspective:700px
}

.die.roll{
  animation:
    diceRollSmooth
    .92s
    cubic-bezier(.16,.82,.22,1)
    both
}

.die.settle{
  animation:
    diceSettleSmooth
    .26s
    cubic-bezier(.2,.9,.25,1)
    both
}

@keyframes diceRollSmooth{
  0%{
    transform:
      translate3d(0,75px,0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(0deg)
      scale(.62);
    opacity:.35;
    filter:blur(3px)
  }

  16%{
    transform:
      translate3d(-28px,-48px,0)
      rotateX(100deg)
      rotateY(80deg)
      rotateZ(55deg)
      scale(.86);
    opacity:1;
    filter:blur(0)
  }

  34%{
    transform:
      translate3d(30px,-85px,0)
      rotateX(225deg)
      rotateY(185deg)
      rotateZ(125deg)
      scale(1.05)
  }

  52%{
    transform:
      translate3d(-24px,-12px,0)
      rotateX(365deg)
      rotateY(300deg)
      rotateZ(200deg)
      scale(.94)
  }

  69%{
    transform:
      translate3d(17px,-34px,0)
      rotateX(505deg)
      rotateY(420deg)
      rotateZ(275deg)
      scale(1.02)
  }

  84%{
    transform:
      translate3d(-7px,5px,0)
      rotateX(610deg)
      rotateY(515deg)
      rotateZ(330deg)
      scale(.98)
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotateX(680deg)
      rotateY(570deg)
      rotateZ(360deg)
      scale(1);
    opacity:1;
    filter:blur(0)
  }
}

@keyframes diceSettleSmooth{
  0%{
    transform:scale(.93) rotateZ(-1deg);
    filter:brightness(1.15)
  }

  55%{
    transform:scale(1.045) rotateZ(.6deg);
    filter:brightness(1.06)
  }

  100%{
    transform:scale(1) rotateZ(0);
    filter:brightness(1)
  }
}

/* =========================
   COIN
   ========================= */

.coin-stage{
  width:150px;
  height:180px;
  display:grid;
  place-items:center;
  perspective:900px;
  position:relative
}

.coin-shadow{
  position:absolute;
  width:92px;
  height:18px;
  bottom:18px;
  border-radius:50%;
  background:#0007;
  filter:blur(8px);
  transform:scale(.65);
  opacity:.35;
  will-change:transform,opacity
}

.coin{
  width:118px;
  height:118px;
  border-radius:50%;
  display:grid;
  place-items:center;
  position:relative;
  background:
    radial-gradient(
      circle at 32% 27%,
      #fff8cf 0 7%,
      #f7dd72 20%,
      #d7a72d 62%,
      #a87817 100%
    );
  border:5px solid #f6dc73;
  color:#654700;
  font-size:22px;
  font-weight:900;
  box-shadow:
    inset 0 2px 4px #fff8,
    inset 0 -7px 12px #80580066,
    0 18px 35px #0008;
  transform-style:preserve-3d;
  will-change:transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden
}

.coin::before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:50%;
  border:2px solid #fff6;
  box-shadow:inset 0 0 0 2px #8c641c55
}

.coin::after{
  content:"";
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:6px solid #d5a62d;
  transform:translateZ(-1px)
}

.coin.flip{
  animation:
    coinTossSmooth
    1.12s
    cubic-bezier(.14,.72,.2,1)
    both
}

.coin.coin-settle{
  animation:
    coinSettleSmooth
    .26s
    cubic-bezier(.18,.9,.3,1)
    both
}

@keyframes coinTossSmooth{
  0%{
    transform:
      translate3d(0,88px,0)
      rotateX(0deg)
      rotateY(0deg)
      rotateZ(-5deg)
      scale(.72)
  }

  14%{
    transform:
      translate3d(-8px,25px,0)
      rotateX(360deg)
      rotateY(35deg)
      rotateZ(-4deg)
      scale(.88)
  }

  32%{
    transform:
      translate3d(9px,-58px,0)
      rotateX(900deg)
      rotateY(75deg)
      rotateZ(4deg)
      scale(1.03)
  }

  50%{
    transform:
      translate3d(-5px,-80px,0)
      rotateX(1440deg)
      rotateY(120deg)
      rotateZ(-3deg)
      scale(1.07)
  }

  67%{
    transform:
      translate3d(4px,-38px,0)
      rotateX(1980deg)
      rotateY(160deg)
      rotateZ(2deg)
      scale(1.02)
  }

  82%{
    transform:
      translate3d(-2px,-7px,0)
      rotateX(2340deg)
      rotateY(190deg)
      rotateZ(-1deg)
      scale(.98)
  }

  93%{
    transform:
      translate3d(1px,3px,0)
      rotateX(2520deg)
      rotateY(210deg)
      rotateZ(1deg)
      scale(1.01)
  }

  100%{
    transform:
      translate3d(0,0,0)
      rotateX(2700deg)
      rotateY(225deg)
      rotateZ(0deg)
      scale(1)
  }
}

@keyframes coinSettleSmooth{
  0%{
    transform:scale(.94);
    filter:brightness(1.15)
  }

  55%{
    transform:scale(1.045);
    filter:brightness(1.06)
  }

  100%{
    transform:scale(1);
    filter:brightness(1)
  }
}

.coin-shadow.tossing{
  animation:
    shadowTossSmooth
    1.12s
    cubic-bezier(.14,.72,.2,1)
    both
}

@keyframes shadowTossSmooth{
  0%{
    transform:scale(.48);
    opacity:.16
  }

  25%{
    transform:scale(.67);
    opacity:.28
  }

  50%{
    transform:scale(.45);
    opacity:.14
  }

  70%{
    transform:scale(.72);
    opacity:.38
  }

  86%{
    transform:scale(.92);
    opacity:.52
  }

  100%{
    transform:scale(1);
    opacity:.62
  }
}

.hint{
  position:absolute;
  bottom:16px;
  color:#8891a2;
  font-size:12px;
  text-align:center;
  width:100%
}

input[type=file]{
  display:none
}

/* =========================
   RESPONSIVE
   ========================= */

@media(max-height:680px){

  .app{
    padding:
      calc(8px + var(--safe-top))
      8px
      calc(8px + var(--safe-bottom));
    gap:7px
  }

  .topbar{
    height:44px
  }

  .icon{
    width:40px;
    height:40px
  }

  .bottom{
    height:56px
  }

  .player{
    border-radius:22px
  }

  .lp{
    margin:4px 0 7px
  }

  .life-bar{
    margin-bottom:8px
  }

  .lp-op,
  .lp-amount{
    height:36px
  }

  .image-slot{
    width:60px;
    height:60px;
    top:calc(8px + var(--safe-top) + 44px);
    left:8px
  }
}

@media(max-width:420px){

  .image-slot{
    width:62px;
    height:62px
  }
}

body,
.app,
.player,
.bottom,
.tool,
.icon{
  touch-action:manipulation
}
</style>
</head>

<body>

<!-- =========================
     IMAGE SLOT TOP LEFT
     ========================= -->

<div class="image-slot empty" id="imageSlot1">
  <input
    type="file"
    id="imageInput1"
    accept="image/png,image/*"
  >
</div>

<div class="app">

  <div class="topbar">

    <button
      class="icon"
      id="bgBtn"
      aria-label="Sfondo"
    >▧</button>

    <input
      id="bgInput"
      type="file"
      accept="image/*"
    >

    <button
      class="icon"
      id="resetBtn"
      aria-label="Nuova partita"
    >↻</button>

  </div>

  <main class="players">

    <!-- PLAYER 1 -->
    <section class="player">

      <div class="pname">PLAYER 1</div>

      <div class="lp" id="lp1">8000</div>

      <div
        class="life-bar"
        aria-label="Vitalità Player 1"
      >
        <div
          class="life-fill"
          id="lifeFill1"
        ></div>
      </div>

      <div
        class="controls"
        role="group"
        aria-label="Modifica Life Points giocatore 1"
      >

        <button
          class="lp-op minus selected"
          type="button"
          data-p="1"
          data-sign="-1"
          aria-label="Sottrai"
        >−</button>

        <input
          class="lp-amount"
          id="amount1"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          placeholder="Cifra"
          aria-label="Cifra Life Points giocatore 1"
        >

        <button
          class="lp-op plus"
          type="button"
          data-p="1"
          data-sign="1"
          aria-label="Aggiungi"
        >+</button>

      </div>

    </section>

    <!-- PLAYER 2 -->
    <section class="player">

      <div class="pname">PLAYER 2</div>

      <div class="lp" id="lp2">8000</div>

      <div
        class="life-bar"
        aria-label="Vitalità Player 2"
      >
        <div
          class="life-fill"
          id="lifeFill2"
        ></div>
      </div>

      <div
        class="controls"
        role="group"
        aria-label="Modifica Life Points giocatore 2"
      >

        <button
          class="lp-op minus selected"
          type="button"
          data-p="2"
          data-sign="-1"
          aria-label="Sottrai"
        >−</button>

        <input
          class="lp-amount"
          id="amount2"
          type="number"
          inputmode="numeric"
          min="0"
          step="1"
          placeholder="Cifra"
          aria-label="Cifra Life Points giocatore 2"
        >

        <button
          class="lp-op plus"
          type="button"
          data-p="2"
          data-sign="1"
          aria-label="Aggiungi"
        >+</button>

      </div>

    </section>

  </main>

  <nav class="bottom">

    <button
      class="tool"
      id="diceBtn"
      title="Dado"
    >⚄</button>

    <button
      class="tool"
      id="coinBtn"
      title="Moneta"
    >◉</button>

    <button
      class="tool"
      id="historyBtn"
      title="Storico"
    >☷</button>

    <button
      class="tool"
      id="notesBtn"
      title="Appunti"
    >✎</button>

  </nav>

</div>

<div class="modal" id="modal">

  <div class="sheet">

    <div class="sheethead">

      <b id="modalTitle"></b>

      <button
        class="close"
        id="close"
      >×</button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>

<script>
/* =========================================================
   STATE
   ========================================================= */

const state = {
  lp:[8000,8000],
  history:[],
  notes:"",
  bg:
    localStorage.getItem("ygo-bg") || "",
  image:
    localStorage.getItem("ygo-image-1") || ""
};

/*
  Contatori dei lanci della partita corrente.

  NON vengono salvati nel localStorage:
  vengono azzerati quando la pagina viene ricaricata
  e soprattutto quando viene premuto "Nuova partita".
*/
let diceRollCount = 0;
let coinFlipCount = 0;

const $ = s => document.querySelector(s);

const modal = $("#modal");
const modalBody = $("#modalBody");
const modalTitle = $("#modalTitle");

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function save(){

  localStorage.setItem(
    "ygo-state",
    JSON.stringify({
      lp:state.lp,
      history:state.history,
      notes:state.notes
    })
  );

  if(state.bg){

    localStorage.setItem(
      "ygo-bg",
      state.bg
    );

  }else{

    localStorage.removeItem("ygo-bg");
  }

  if(state.image){

    localStorage.setItem(
      "ygo-image-1",
      state.image
    );

  }else{

    localStorage.removeItem("ygo-image-1");
  }

  localStorage.removeItem("ygo-image-2");
}

const old = JSON.parse(
  localStorage.getItem("ygo-state") || "null"
);

if(old){

  state.lp =
    Array.isArray(old.lp) &&
    old.lp.length === 2
      ? old.lp
      : state.lp;

  state.history =
    Array.isArray(old.history)
      ? old.history
      : [];

  state.notes =
    typeof old.notes === "string"
      ? old.notes
      : "";
}

/* =========================================================
   BACKGROUND
   ========================================================= */

if(state.bg){

  document.body.style.setProperty(
    "--user-bg",
    `url("${state.bg}")`
  );
}

/* =========================================================
   LIFE BAR COLOR
   ========================================================= */

function lifeColor(value){

  const stops = [
    {
      value:8000,
      color:[105,217,139]
    },
    {
      value:7000,
      color:[125,218,91]
    },
    {
      value:6000,
      color:[181,222,70]
    },
    {
      value:5000,
      color:[232,218,58]
    },
    {
      value:4000,
      color:[247,181,50]
    },
    {
      value:3000,
      color:[245,133,48]
    },
    {
      value:2000,
      color:[239,91,67]
    },
    {
      value:1000,
      color:[235,67,78]
    },
    {
      value:0,
      color:[205,42,67]
    }
  ];

  if(value >= 8000){

    if(value === 8000){

      return {
        rgb:"rgb(105,217,139)",
        glow:"rgba(105,217,139,.22)"
      };
    }

    return {
      rgb:"rgb(92,235,138)",
      glow:"rgba(92,235,138,.38)"
    };
  }

  for(let i=0;i<stops.length-1;i++){

    const high=stops[i];
    const low=stops[i+1];

    if(
      value <= high.value &&
      value >= low.value
    ){

      const range =
        high.value-low.value;

      const progress =
        (high.value-value)/range;

      const r =
        Math.round(
          high.color[0] +
          (low.color[0]-high.color[0]) *
          progress
        );

      const g =
        Math.round(
          high.color[1] +
          (low.color[1]-high.color[1]) *
          progress
        );

      const b =
        Math.round(
          high.color[2] +
          (low.color[2]-high.color[2]) *
          progress
        );

      return {
        rgb:`rgb(${r},${g},${b})`,
        glow:`rgba(${r},${g},${b},.30)`
      };
    }
  }

  return {
    rgb:"rgb(205,42,67)",
    glow:"rgba(205,42,67,.35)"
  };
}

/* =========================================================
   LIFE BAR
   ========================================================= */

function updateLifeBar(player){

  const value =
    Math.max(
      0,
      Number(state.lp[player-1]) || 0
    );

  const fill =
    $("#lifeFill"+player);

  if(!fill)return;

  const percentage =
    Math.min(
      100,
      Math.max(
        0,
        (value/8000)*100
      )
    );

  fill.style.width =
    percentage + "%";

  const color =
    lifeColor(value);

  fill.style.background =
    color.rgb;

  fill.style.boxShadow =
    `0 0 11px ${color.glow}`;
}

/* =========================================================
   RENDER
   ========================================================= */

function render(){

  state.lp.forEach((value,index)=>{

    const player=index+1;

    $("#lp"+player).textContent =
      Number(value).toLocaleString("it-IT");

    updateLifeBar(player);
  });

  renderImage();

  save();
}

/* =========================================================
   LIFE POINT CHANGES
   ========================================================= */

function change(p,n){

  const before =
    state.lp[p-1];

  state.lp[p-1] =
    Math.max(
      0,
      before+n
    );

  state.history.unshift({

    time:
      new Date().toLocaleTimeString(
        "it-IT",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      ),

    p,
    n,
    before,
    after:state.lp[p-1]
  });

  render();
}

function applyAmount(p,sign){

  const input =
    $("#amount"+p);

  const value =
    Number(input.value);

  if(
    !Number.isFinite(value) ||
    value<0 ||
    !Number.isInteger(value)
  ){
    return;
  }

  if(value===0){

    input.value="";

    return;
  }

  change(
    p,
    sign*value
  );

  input.value="";

  input.focus({
    preventScroll:true
  });
}

/* =========================================================
   LP BUTTONS
   ========================================================= */

document
  .querySelectorAll(".lp-op")
  .forEach(button=>{

    button.onclick=()=>{

      const p =
        Number(button.dataset.p);

      const sign =
        Number(button.dataset.sign);

      const wrap =
        button.parentElement;

      wrap
        .querySelectorAll(".lp-op")
        .forEach(x=>
          x.classList.remove("selected")
        );

      button.classList.add("selected");

      applyAmount(p,sign);
    };
  });

document
  .querySelectorAll(".lp-amount")
  .forEach(input=>{

    input.addEventListener(
      "keydown",
      e=>{

        if(e.key!=="Enter")return;

        const wrap =
          input.parentElement;

        const selected =
          wrap.querySelector(
            ".lp-op.selected"
          ) ||
          wrap.querySelector(".minus");

        applyAmount(
          Number(selected.dataset.p),
          Number(selected.dataset.sign)
        );
      }
    );
  });

   HISTORY
   ========================================================= */

$("#historyBtn").onclick=()=>{

  if(!state.history.length){

    openModal(
      "Storico",
      `<div
        class="hint"
        style="position:relative;bottom:auto;padding:40px 0"
      >
        Nessuna modifica

    return;
  }

    "Storico",
    `<div class="history">

      ${state.history.map(x=>`

        <div class="row">

            ${x.time} · P${x.p}
          </small>

          <span

          >
            ${x.n>=0?"+":""}

            →
            ${x.after.toLocaleString("it-IT")}
          </span>

      `).join("")}

  );
};

/* =========================================================
   NOTES
   ========================================================= */

$("#notesBtn").onclick=()=>{

  const safeNotes =
    state.notes
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;");

  openModal(
    "Appunti",
    `<textarea id="notes">${safeNotes}</textarea>`
  );

  const notes=$("#notes");

  notes.oninput=()=>{

    state.notes=notes.value;

    save();
  };
};

/* =========================================================
   RANDOM
   ========================================================= */

function secureRandomInt(max){

  if(
    window.crypto &&
    crypto.getRandomValues
  ){

    const limit =
      Math.floor(
        0x100000000/max
      )*max;

    const array =
      new Uint32Array(1);

    do{

      crypto.getRandomValues(array);

    }while(array[0]>=limit);

    return array[0]%max;
  }

  return Math.floor(
    Math.random()*max
  );
}

/*
  Dado completamente casuale.
*/
function secureDie(){

  return 1+
    secureRandomInt(6);
}

/*
  Dado casuale tra 4 e 6.
*/
function secureDieHigh(){

  return 4+
    secureRandomInt(3);
}

/*
  Dado casuale tra 1 e 3.
*/
function secureDieLow(){

  return 1+
    secureRandomInt(3);
}

function secureCoin(){

  return secureRandomInt(2)===0
    ? "TESTA"
    : "CROCE";
}

/* =========================================================
   DICE
   ========================================================= */

let dieVal=1;
let dieRolling=false;

function randomTemporaryDie(finalValue){

  let value;

  do{

    value=secureDie();

  }while(value===finalValue);

  return value;
}

$("#diceBtn").onclick=()=>{

  openModal(
    "Dado",

    `<div class="dice-wrap">

      <div
        class="die"
        id="die"
      >•</div>

      <div class="hint">
        Tocca il dado per rilanciare
      </div>

    </div>`
  );

  rollDie();
};

function rollDie(){

  const die=$("#die");

  if(!die || dieRolling)return;

  dieRolling=true;

  /*
    Il contatore viene incrementato SOLO quando
    parte effettivamente un nuovo lancio.
  */

  diceRollCount++;

  /*
    1° lancio: 4-6
    2° lancio: 1-3
    dal 3°: 1-6 completamente casuale
  */

  if(diceRollCount===1){

    dieVal=secureDieHigh();

  }else if(diceRollCount===2){

    dieVal=secureDieLow();

  }else{

    dieVal=secureDie();
  }

  die.classList.remove(
    "roll",
    "settle"
  );

  void die.offsetWidth;

  /*
    Durante l'animazione vengono mostrati
    soltanto valori temporanei.
  */

  die.textContent =
    randomTemporaryDie(dieVal);

  die.classList.add("roll");

  const started =
    performance.now();

  const duration=920;

  let lastChange=0;

  const tick=now=>{

    if(!die.isConnected){

      dieRolling=false;

      return;
    }

    const elapsed =
      now-started;

    if(elapsed<duration){

      if(
        now-lastChange>105
      ){

        die.textContent =
          randomTemporaryDie(
            dieVal
          );

        lastChange=now;
      }

      requestAnimationFrame(tick);

    }else{

      /*
        O resultado definitivo só aparece
        no final do lançamento.
      */

      die.textContent =
        String(dieVal);

      die.classList.remove("roll");

      void die.offsetWidth;

      die.classList.add("settle");

      dieRolling=false;
    }
  };

  requestAnimationFrame(tick);
}

/* =========================================================
   COIN
   ========================================================= */

let coinVal="TESTA";
let coinBusy=false;

$("#coinBtn").onclick=()=>{

  openModal(
    "Moneta",

    `<div class="coin-wrap">

      <div class="coin-stage">

        <div
          class="coin"
          id="coin"
        >•</div>

        <div
          class="coin-shadow"
          id="coinShadow"
        ></div>

      </div>

      <div class="hint">
        Tocca la moneta per rilanciarla
      </div>

    </div>`
  );

  flipCoin();
};

function flipCoin(){

  const coin=$("#coin");

  const shadow=$("#coinShadow");

  if(!coin || coinBusy)return;

  coinBusy=true;

  /*
    Incrementiamo il contatore del lancio effettivo.
  */

  coinFlipCount++;

  /*
    1° lancio: TESTA
    2° lancio: TESTA
    3° lancio: CROCE
    dal 4°: completamente casuale
  */

  if(coinFlipCount===1){

    coinVal="TESTA";

  }else if(coinFlipCount===2){

    coinVal="TESTA";

  }else if(coinFlipCount===3){

    coinVal="CROCE";

  }else{

    coinVal=secureCoin();
  }

  coin.classList.remove(
    "flip",
    "coin-settle"
  );

  if(shadow){

    shadow.classList.remove(
      "tossing"
    );
  }

  /*
    Il risultato rimane nascosto durante
    l'animazione.
  */

  coin.textContent="•";

  void coin.offsetWidth;

  coin.classList.add("flip");

  if(shadow){

    void shadow.offsetWidth;

    shadow.classList.add("tossing");
  }

  coin.addEventListener(
    "animationend",
    ()=>{

      coin.textContent=coinVal;

      coin.classList.remove("flip");

      void coin.offsetWidth;

      coin.classList.add(
        "coin-settle"
      );

      coinBusy=false;

    },
    {once:true}
  );
}

/* =========================================================
   MODAL CLICK HANDLERS
   ========================================================= */

modalBody.addEventListener(
  "click",
  e=>{

    if(e.target.id==="die"){

      rollDie();
    }

    if(e.target.id==="coin"){

      flipCoin();
    }
  }
);

/* =========================================================
   BACKGROUND
   ========================================================= */

$("#bgBtn").onclick=()=>{

  $("#bgInput").click();
};

$("#bgInput").onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=
    new FileReader();

  reader.onload=()=>{

    state.bg=reader.result;

    document.body.style.setProperty(
      "--user-bg",
      `url("${reader.result}")`
    );

    save();
  };

  reader.readAsDataURL(file);
};

/* =========================================================
   IMAGE SLOT
   ========================================================= */

function renderImage(){

  const slot =
    $("#imageSlot1");

  const oldImage =
    slot.querySelector("img");

  if(oldImage){

    oldImage.remove();
  }

  if(state.image){

    slot.classList.remove(
      "empty"
    );

    const img =
      document.createElement("img");

    img.src=state.image;

    img.alt="Immagine";

    slot.appendChild(img);

  }else{

    slot.classList.add(
      "empty"
    );
  }
}

const imageSlot =
  $("#imageSlot1");

const imageInput =
  $("#imageInput1");

imageSlot.addEventListener(
  "click",
  e=>{

    if(!state.image){

      imageInput.click();
    }
  }
);

imageSlot.addEventListener(
  "click",
  e=>{

    if(
      state.image &&
      e.target.tagName==="IMG"
    ){

      imageInput.click();
    }
  }
);

imageInput.addEventListener(
  "change",
  e=>{

    const file=
      e.target.files[0];

    if(!file)return;

    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      imageInput.value="";

      return;
    }

    const reader =
      new FileReader();

    reader.onload=()=>{

      state.image=
        reader.result;

      renderImage();

      save();

      imageInput.value="";
    };

    reader.readAsDataURL(file);
  }
);

let imageLongPressTimer=null;
let imageLongPressTriggered=false;

imageSlot.addEventListener(
  "pointerdown",
  e=>{

    if(
      !state.image ||
      e.target.tagName!=="IMG"
    ){
      return;
    }

    imageLongPressTriggered=false;

    imageSlot.classList.remove(
      "removing"
    );

    imageLongPressTimer =
      setTimeout(()=>{

        imageLongPressTriggered=true;

        imageSlot.classList.add(
          "removing"
        );

        setTimeout(()=>{

          if(!imageLongPressTriggered){
            return;
          }

          state.image="";

          imageInput.value="";

          imageSlot.classList.remove(
            "removing"
          );

          renderImage();

          save();

        },120);

      },650);
  }
);

function cancelImageLongPress(){

  if(imageLongPressTimer){

    clearTimeout(
      imageLongPressTimer
    );

    imageLongPressTimer=null;
  }
}

imageSlot.addEventListener(
  "pointerup",
  cancelImageLongPress
);

imageSlot.addEventListener(
  "pointercancel",
  cancelImageLongPress
);

imageSlot.addEventListener(
  "pointerleave",
  cancelImageLongPress
);

imageSlot.addEventListener(
  "click",
  e=>{

    if(imageLongPressTriggered){

      e.preventDefault();
      e.stopPropagation();

      imageLongPressTriggered=false;
    }
  },
  true
);

/* =========================================================
   NEW GAME
   ========================================================= */

function newGame(){

  state.lp=[
    8000,
    8000
  ];

  state.history=[];

  state.notes="";

  /*
    RESET DEI LANCI SPECIALI

    La nuova partita ricomincia da:
    - dado lancio #1 → 4-6
    - dado lancio #2 → 1-3
    - moneta lancio #1 → TESTA
    - moneta lancio #2 → TESTA
    - moneta lancio #3 → CROCE
  */

  diceRollCount=0;
  coinFlipCount=0;

  /*
    Immagine e sfondo NON vengono cancellati.
  */

  render();

  closeModal();
}

$("#resetBtn").onclick=newGame;

/* =========================================================
   PREVENT DOUBLE TOUCH / ZOOM
   ========================================================= */

let lastTouch=0;

document.addEventListener(
  "touchend",
  e=>{

    const now=Date.now();

    if(
      now-lastTouch<320
    ){

      e.preventDefault();
    }

    lastTouch=now;

  },
  {passive:false}
);

[
  "gesturestart",
  "gesturechange",
  "gestureend"
].forEach(type=>{

  document.addEventListener(
    type,
    e=>e.preventDefault(),
    {passive:false}
  );
});

/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();
</script>
